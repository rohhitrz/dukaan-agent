# Self-hosted Langfuse for this project only.
#
# A trimmed version of the official compose file
# (https://raw.githubusercontent.com/langfuse/langfuse/main/docker-compose.yml):
# same six services, only the settings this project needs. Langfuse v3+ needs all
# six - Postgres for app data, ClickHouse for traces, Redis for the ingestion
# queue, MinIO (S3) for the raw event blobs, and a web + worker pair.
#
# Ports are shifted off the defaults because another Langfuse (the sutra project)
# already owns :3000 and :9090 on this machine:
#   web  -> http://localhost:3100
#   minio-> http://localhost:9190 (console :9191)
# Postgres/Redis/ClickHouse are deliberately NOT published; nothing outside this
# compose network needs them.
#
# Every credential below is local-only throwaway. Do not reuse any of it anywhere.
#
#   docker compose up -d     # wait ~2 min for "Ready" in langfuse-web logs
#   docker compose down      # stop     (add -v to wipe the traces too)

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
  SALT: be7081c44ed5ee7f0fab473a79487ce4
  ENCRYPTION_KEY: 48913bccc673a2d1f42344ec6cd26e9545891afbadc95f18933a967b43107ee5
  NEXTAUTH_URL: http://localhost:3100
  NEXTAUTH_SECRET: 018bcba8e603eba40e254120ce5a3b1fd21a0e9d4cb8756f
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: myredissecret
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: always
    depends_on: &deps
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports:
      - "3100:3000"
    environment:
      <<: *langfuse-env
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9190
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # Headless init: creates the org, project, API keys and first user on
      # startup if they don't exist, so the keys in .env are known up front and
      # there is no click-through setup. Values must not be quoted.
      LANGFUSE_INIT_ORG_ID: dukaan
      LANGFUSE_INIT_ORG_NAME: Dukaan
      LANGFUSE_INIT_PROJECT_ID: dukaan-agent
      LANGFUSE_INIT_PROJECT_NAME: Dukaan Agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-dukaan-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-dukaan-local
      LANGFUSE_INIT_USER_EMAIL: dev@dukaan.local
      LANGFUSE_INIT_USER_NAME: Dev
      LANGFUSE_INIT_USER_PASSWORD: dukaan-local-dev

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: always
    depends_on: *deps
    environment: *langfuse-env

  postgres:
    image: docker.io/postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/redis:7
    restart: always
    command: --requirepass myredissecret --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    # Creates the bucket before starting, so Langfuse finds it on first write.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9190:9000"
      - "127.0.0.1:9191:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
