<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukaan Support</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --ink: #1c1b19; --muted: #6f6b66;
    --line: #e5e1db; --accent: #1f6f5c; --tool: #f1efe9; --err: #b4423a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { margin: 0; font-size: 16px; letter-spacing: -0.01em; }
  header span { color: var(--muted); font-size: 13px; }
  header button {
    margin-left: auto; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px;
  }
  #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; max-width: 78%; white-space: pre-wrap;
  }
  .user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .agent .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .trace { max-width: 78%; margin: 0 0 14px 0; font-size: 12.5px; }
  .trace details {
    background: var(--tool); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; margin-bottom: 6px;
  }
  .trace summary { cursor: pointer; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .trace pre {
    margin: 8px 0 2px; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #3b3935;
  }
  .meta { color: var(--muted); font-size: 12px; margin: -8px 0 16px; }
  .err { color: var(--err); }
  form {
    display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line);
    background: var(--panel);
  }
  form > div { display: flex; gap: 8px; max-width: 760px; width: 100%; margin: 0 auto; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: var(--bg); color: var(--ink);
  }
  button[type=submit] {
    padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent);
    color: #fff; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>Dukaan Support</h1>
    <span id="sid"></span>
    <button id="reset">New conversation</button>
  </header>

  <div id="log">
    <div class="msg agent"><div class="bubble">Hi! I'm the Dukaan support agent. Ask me about an order, a return, a refund or a delivery. Try order 1042.</div></div>
  </div>

  <form id="form"><div>
    <input id="input" type="text" placeholder="Where is my order 1043?" autocomplete="off" autofocus>
    <button type="submit" id="send">Send</button>
  </div></form>

<script>
  const sessionId = 'sess-' + Math.random().toString(36).slice(2, 8);
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  document.getElementById('sid').textContent = sessionId;

  const el = (cls, html) => {
    const d = document.createElement('div');
    d.className = cls;
    d.innerHTML = html;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  };
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  function renderTrace(trace) {
    const rows = trace.map(e => {
      if (e.kind === 'llm') {
        return `<details><summary>llm &middot; ${e.latency_ms}ms &middot; ${e.prompt_tokens ?? '?'}&rarr;${e.completion_tokens ?? '?'} tokens &middot; ${esc(e.finish_reason)}</summary></details>`;
      }
      const failed = e.result && e.result.error ? ' class="err"' : '';
      return `<details><summary${failed}>${esc(e.name)}(${esc(JSON.stringify(e.args))}) &middot; ${e.latency_ms}ms</summary>`
           + `<pre>${esc(JSON.stringify(e.result, null, 2))}</pre></details>`;
    }).join('');
    if (rows) el('trace', rows);
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    el('msg user', `<div class="bubble">${esc(text)}</div>`);
    input.value = '';
    send.disabled = true;
    const pending = el('meta', 'thinking&hellip;');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      pending.remove();
      if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
      const data = await res.json();
      renderTrace(data.trace);
      el('msg agent', `<div class="bubble">${esc(data.reply)}</div>`);
      el('meta', `${data.latency_ms}ms &middot; ${data.steps} llm call(s)`);
    } catch (err) {
      pending.remove();
      el('meta err', esc(err.message));
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  document.getElementById('reset').addEventListener('click', async () => {
    await fetch('/reset?session_id=' + encodeURIComponent(sessionId), { method: 'POST' });
    location.reload();
  });
</script>
</body>
</html>
